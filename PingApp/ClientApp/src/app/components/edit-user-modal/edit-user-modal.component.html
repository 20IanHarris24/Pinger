<div class="modal-header">

  <h5 class="modal-title">
    Edit user
  </h5>

  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="onCancel()">
  </button>

</div>


<div class="modal-body">

  <form [formGroup]="editUserForm">

    <div class="mb-3">

      <label
        for="userName"
        class="form-label">
        Username
      </label>

      <input
        id="userName"
        type="text"
        class="form-control"
        formControlName="userName">

    </div>


    <div class="mb-3">

      <label
        for="email"
        class="form-label">
        Email
      </label>

      <input
        id="email"
        type="email"
        class="form-control"
        formControlName="email">

    </div>


    <div class="mb-3">

      <label
        for="role"
        class="form-label">
        Role
      </label>

      <select
        id="role"
        class="form-select"
        formControlName="role">

        <option value="Viewer">
          Viewer
        </option>

        <option value="Admin">
          Admin
        </option>

      </select>

    </div>

  </form>

</div>


<div class="modal-footer">

  <button
    type="button"
    class="btn"
    (click)="onCancel()">
    Cancel
  </button>

  <button
    type="button"
    class="btn btn-primary"
    [disabled]="editUserForm.invalid"
    (click)="onSave()">

    <i class="ti ti-device-floppy"></i>
    Save

  </button>

</div>
