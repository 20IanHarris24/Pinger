<div class="modal-header">
  <h5 class="modal-title">Manage users</h5>

  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()">
  </button>
</div>

<div class="modal-body">

  <div class="mb-4">

    <app-buttons
      label="Add new user"
      (clicked)="addNewUser()">
    </app-buttons>


  </div>

  <hr>

  <h4>Existing users</h4>

  <ng-container *ngFor="let user of users">
    <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
      <div>
        <strong>{{ user.userName }}</strong>
        <span class="text-secondary">
          {{ user.email }}
        </span>
      </div>


      <app-buttons
        btnProperty="btn btn-ghost-primary"
        iconClass="ti ti-edit"
        label="Edit"
        (clicked)="editUser(user)">
      </app-buttons>

      <app-buttons
        btnProperty="btn btn-ghost-danger"
        iconClass="ti ti-trash"
        label="Delete"
        (clicked)="deleteUser(user)">
      </app-buttons>




    </div>
  </ng-container>

</div>

<div class="modal-footer">
  <button
    type="button"
    class="btn"
    (click)="activeModal.close()">
    Close
  </button>
</div>
