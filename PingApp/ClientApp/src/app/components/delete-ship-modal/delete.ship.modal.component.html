<div class="modal-header">
  <h4 class="modal-title">DELETE</h4>

</div>


<div class="modal-body">
          <div>🛑 Are you sure? Once deleted the information cannot be recovered 🛑</div>
</div>


<div class="modal-footer">
  <button type="button" class="btn btn-outline-purple" (click) = "cancelDelete()">Cancel</button>
  <button type="button" class="btn btn-outline-secondary" [class.fade-out]="isConfirmed" [disabled]="isConfirmed" (click) = "confirmDelete()">Confirm</button>
</div>
