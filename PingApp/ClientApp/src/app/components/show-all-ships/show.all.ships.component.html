<h2> Current Database Content</h2>

<div class="spinner_pos paginate_format">


  <ng-container *ngIf="viewModel$ | async as vm">



      <ng-container *ngIf ="deleteState.deleteStatus$ | async as dst">
        <div *ngIf="dst === 'deleting'" class="alert alert-info">⏳ Deleting ship, please wait...</div>
        <div *ngIf="dst === 'success'" class="alert alert-success">🟢 Ship successfully deleted! 🚢</div>
        <div *ngIf="dst === 'error'" class="alert alert-danger">❌ {{ deleteState.deleteErrorMessage$ | async }}</div>
      </ng-container>


    <ng-container *ngIf="vm.isLoading; else showShips">
      <div class="spinner_center">
      <app-spinner-2></app-spinner-2>
      </div>
    </ng-container>



    @let newlyAddedShipId = (newlyAddedShipId$ | async);
    @let newlyEditedShipId = (newlyEditedShipId$ | async);

    <ng-template #showShips>
      <ng-container *ngIf="vm.ships.length >0; else noShips">
        <div class="row row-cards row-deck">
          <ng-container *ngFor="let a_Ship of vm.ships; let i = index; trackBy: utility.trackByShipResultId">
            <div class="col-12 col-sm-6 col-lg-4">
              <div class="card"
                   [class.flash-new]="newlyAddedShipId === a_Ship.id"
                   [class.flash-edit]="newlyEditedShipId === a_Ship.id">
                <div class="card-body position-relative"
                     (mouseenter)="onMouseOver(i)"
                     (click)="onMouseClick(i)"
                     (mouseleave)="onMouseOff()"
                     [class.border-highlight]="hoverIndex === i && mouseAction"
                     [class.border-highlight-selected]="selectIndex === i && mouseAction">

                  <h2 class="card-title">{{ 'Name:   ' + a_Ship.name }}</h2>

                  <app-tooltip
                    [ship]="a_Ship"
                    [isSelected]="i === selectIndex"
                    (edit)="actionService.select('Edit', $event)"
                    (delete)="actionService.select('Delete', $event)">
                  </app-tooltip>


                </div>
              </div>
            </div>
          </ng-container>
        </div>

      </ng-container>
    </ng-template>
  </ng-container>
</div>


<ng-template #noShips>
  <h2>No Ship data available</h2>
</ng-template>
