<div class="page">

  @if (isAuthenticated$ | async) {
    <header class="navbar navbar-expand-md d-print-none">
      <div class="container-xl">

        <a
          class="navbar-brand"
          routerLink="/monitor">
          Pinger
        </a>

        <div class="navbar-nav flex-row order-md-last">
          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="logout()">
            Logout
          </button>
        </div>

        <div class="collapse navbar-collapse">
          <ul class="navbar-nav">
            <li class="nav-item"
                routerLinkActive="active">
              <a
                class="nav-link"
                routerLink="/monitor"
                >
                Monitor
              </a>
            </li>


            @if (isAdmin$ | async) {
            <li class="nav-item"
                routerLinkActive="active">
              <a
                class="nav-link"
                routerLink="/admin"
                >
                Admin
              </a>
            </li>
           }
          </ul>
        </div>

      </div>
    </header>
  }

  <div class="page-wrapper">
    <div class="page-body">
      <div class="container-xl">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>

</div>
