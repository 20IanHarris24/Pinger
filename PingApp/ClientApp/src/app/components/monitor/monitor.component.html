<div class="page-header d-print-none">
  <div class="container-xl">
    <div class="row g-2 align-items-center">
      <div class="col">
        <h1 class="page-title">
          Status
        </h1>
      </div>
    </div>
  </div>
</div>
<div class="page-body mt-3">
  <div class="container">
    <h3>List</h3>
    <div class="spinner_pos">

      <ng-container  *ngIf="viewModel$ | async as vm">
          <ng-container *ngIf="vm.isLoading; else showShips">
              <app-spinner-2></app-spinner-2>
          </ng-container>



      <ng-template  #showShips>
        <ng-container *ngIf="vm.ships.length > 0; else noShips">
            <div class="row row-cards">
              <div class="col-12 col-md-6 col-lg-4 col-xl-3"  *ngFor="let a_Ship of vm.ships; trackBy: utility.trackByShipResultId">
                <div class="card h-100" [ngClass]="utility.getStatusClass(a_Ship.result)">
                  <div class="card-body border-shadow">
                    <h2 class="card-title mb-3"><strong>Name: </strong>{{a_Ship.name}}</h2>
                    <div class="card-text mb-1"><strong>Status: </strong>{{a_Ship.result}}</div>
                    <div class="card-text"><strong>Host addr: </strong>{{a_Ship.hostAddr}}</div>
                  </div>
                </div>
              </div>
            </div>
          </ng-container>
      </ng-template>


     </ng-container>


      <ng-template #noShips>
        <h2>No ships available</h2>
      </ng-template>


    </div>
  </div>
</div>
